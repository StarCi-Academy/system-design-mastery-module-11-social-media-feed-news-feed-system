# Docker stack for lesson: feed caching with redis (Go representative).
# Working directory: 1-feed-caching-with-redis/.docker
# Start: docker compose -f compose-go.yaml up -d --build
# Stop:  docker compose -f compose-go.yaml down -v
name: 1-feed-caching-with-redis-go

services:
  api:
    container_name: 1-feed-caching-with-redis-go-api
    build:
      context: ../3-go
      dockerfile: Dockerfile
    ports:
      - "3301:3000"
    environment:
      - PORT=3000
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=feed_cache_service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - 1-feed-caching-with-redis-go-network
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: 1-feed-caching-with-redis-go-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=feed_cache_service
    ports:
      - "5438:5432"
    networks:
      - 1-feed-caching-with-redis-go-network

  redis:
    image: redis:7-alpine
    container_name: 1-feed-caching-with-redis-go-redis
    ports:
      - "6386:6379"
    networks:
      - 1-feed-caching-with-redis-go-network

networks:
  1-feed-caching-with-redis-go-network:
    name: 1-feed-caching-with-redis-go-network
