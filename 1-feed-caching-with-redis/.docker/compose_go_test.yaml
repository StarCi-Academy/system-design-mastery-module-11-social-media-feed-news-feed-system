# E2E test compose for Go language track.
# Start: docker compose -f compose_go_test.yaml up -d --build
# Stop:  docker compose -f compose_go_test.yaml down -v

name: 1-feed-caching-go-test

services:
  api:
    container_name: 1-feed-caching-go-test-api
    build:
      context: ../3-go
      dockerfile: Dockerfile
    ports:
      - "3543:3000"
    environment:
      - PORT=3000
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=feed_cache_service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - 1-feed-caching-go-test-network
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: 1-feed-caching-go-test-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=feed_cache_service
    ports:
      - "5443:5432"
    networks:
      - 1-feed-caching-go-test-network

  redis:
    image: redis:7-alpine
    container_name: 1-feed-caching-go-test-redis
    ports:
      - "6383:6379"
    networks:
      - 1-feed-caching-go-test-network

networks:
  1-feed-caching-go-test-network:
    name: 1-feed-caching-go-test-network
