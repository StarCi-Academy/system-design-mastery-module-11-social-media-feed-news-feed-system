# Docker stack for lesson: feed caching with redis (Java representative).
# Working directory: 1-feed-caching-with-redis/.docker
# Start: docker compose -f compose-java.yaml up -d --build
# Stop:  docker compose -f compose-java.yaml down -v
name: 1-feed-caching-with-redis-java

services:
  api:
    container_name: 1-feed-caching-with-redis-java-api
    build:
      context: ../1-java
      dockerfile: Dockerfile
    ports:
      - "3100:3000"
    environment:
      - PORT=3000
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=feed_cache_service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - 1-feed-caching-with-redis-java-network
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: 1-feed-caching-with-redis-java-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=feed_cache_service
    ports:
      - "5433:5432"
    networks:
      - 1-feed-caching-with-redis-java-network

  redis:
    image: redis:7-alpine
    container_name: 1-feed-caching-with-redis-java-redis
    ports:
      - "6380:6379"
    networks:
      - 1-feed-caching-with-redis-java-network

networks:
  1-feed-caching-with-redis-java-network:
    name: 1-feed-caching-with-redis-java-network
