# Docker stack for lesson: feed caching with redis (TypeScript representative).
# (EN: Docker stack for lesson: feed caching with redis.)
#
# Working directory: 1-feed-caching-with-redis/.docker
#
# Start stack:
#   cd 1-feed-caching-with-redis/.docker && docker compose up -d --build
#
# View logs:
#   docker compose logs -f
#
# Cleanup:
#   docker compose down -v
#
name: 1-feed-caching-with-redis

services:
  # NestJS HTTP API — lesson entrypoint (self-build, no cloud image).
  api:
    container_name: 1-feed-caching-with-redis-api
    build:
      context: ../0-typescript
      dockerfile: Dockerfile
    ports:
      # Map host port 3000 -> container 3000 (HTTP API).
      - "3000:3000"
    environment:
      - PORT=3000
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=feed_cache_service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - 1-feed-caching-with-redis-network
    depends_on:
      - db
      - redis

  # PostgreSQL — lesson persistence (source rows before ZADD into ZSET).
  db:
    image: postgres:16-alpine
    container_name: 1-feed-caching-with-redis-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=feed_cache_service
    ports:
      - "5432:5432"
    networks:
      - 1-feed-caching-with-redis-network

  # Redis 7 — Sorted Set materialized feed cache.
  redis:
    image: redis:7-alpine
    container_name: 1-feed-caching-with-redis-redis
    ports:
      - "6379:6379"
    networks:
      - 1-feed-caching-with-redis-network

networks:
  1-feed-caching-with-redis-network:
    name: 1-feed-caching-with-redis-network
