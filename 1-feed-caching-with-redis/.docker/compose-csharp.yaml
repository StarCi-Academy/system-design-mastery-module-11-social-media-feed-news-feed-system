# Docker stack for lesson: feed caching with redis (C# representative).
# Working directory: 1-feed-caching-with-redis/.docker
# Start: docker compose -f compose-csharp.yaml up -d --build
# Stop:  docker compose -f compose-csharp.yaml down -v
name: 1-feed-caching-with-redis-csharp

services:
  api:
    container_name: 1-feed-caching-with-redis-csharp-api
    build:
      context: ../2-csharp
      dockerfile: Dockerfile
    ports:
      - "3201:3000"
    environment:
      - PORT=3000
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=feed_cache_service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - 1-feed-caching-with-redis-csharp-network
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: 1-feed-caching-with-redis-csharp-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=feed_cache_service
    ports:
      - "5437:5432"
    networks:
      - 1-feed-caching-with-redis-csharp-network

  redis:
    image: redis:7-alpine
    container_name: 1-feed-caching-with-redis-csharp-redis
    ports:
      - "6385:6379"
    networks:
      - 1-feed-caching-with-redis-csharp-network

networks:
  1-feed-caching-with-redis-csharp-network:
    name: 1-feed-caching-with-redis-csharp-network
